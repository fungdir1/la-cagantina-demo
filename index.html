<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>La Cagantina</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d2028">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  @font-face{font-family:'Baloo 2';font-style:normal;font-weight:600;font-display:block;src:url(assets/393259b936ba314be8a928c37a7bbfde9fc09b442b6b6de5e610f093daf5ad53.ttf) format('truetype')}
@font-face{font-family:'Baloo 2';font-style:normal;font-weight:800;font-display:block;src:url(assets/db932b3668b6188413fcde58993f7667371033579f131d524cfed3f83c62d7e2.ttf) format('truetype')}
@font-face{font-family:'Luckiest Guy';font-style:normal;font-weight:400;font-display:block;src:url(assets/bde64ad70289579762149264eeaad6f2bf19b542eca5d62ca9fb0d9cb04a47b2.ttf) format('truetype')}
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); color-scheme: dark; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d2028; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  #game { position: absolute; display: block; touch-action: none; }
  #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #fff2ce; font: 28px "Luckiest Guy", "Arial Black", sans-serif; background: #0d2028; z-index: 5; }
  #loader .track { width: 220px; height: 9px; border-radius: 6px; background: #28414b; overflow: hidden; }
  #loadbar { height: 100%; width: 0; background: #ffd158; transition: width .2s; }
  #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 16px; color: #fff2ce; font: 26px "Luckiest Guy", "Arial Black", sans-serif; background: rgba(13,32,40,.98); z-index: 10; }
  .arcade-overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;box-sizing:border-box;padding:max(12px,var(--sat)) 12px max(12px,var(--sab));background:#071d25a6;color:#fff2ce;font:600 17px/1.35 "Baloo 2",sans-serif;overflow:auto;touch-action:pan-y}
  .arcade-dialog{width:min(430px,100%);max-height:calc(100dvh - max(24px,var(--sat)) - max(24px,var(--sab)));overflow-y:auto;box-sizing:border-box;padding:24px;background:#102a34;border-radius:18px;box-shadow:0 12px 40px #0005;overscroll-behavior:contain;touch-action:pan-y}
  .arcade-heading{font:400 28px/1.15 "Luckiest Guy",sans-serif;text-align:center;color:#fff2ce;margin:0 0 24px}
  .arcade-mini-logo{display:block;width:145px;height:auto;margin:0 auto 20px}
  .arcade-button{display:block;box-sizing:border-box;width:100%;min-height:50px;margin:14px 0 0;padding:12px 10px;border:2px solid #fff2ce;border-radius:11px;background:#ffd158;color:#211809;box-shadow:0 4px 0 #906018;font:400 21px/1.2 "Luckiest Guy",sans-serif;cursor:pointer;touch-action:manipulation}
  .arcade-button:active{transform:translateY(2px);box-shadow:0 2px 0 #906018}
  .arcade-secondary{background:#17333e;border-color:#6d8188;color:#fff2ce;box-shadow:none}
  .arcade-secondary:active{box-shadow:none}
  .arcade-link{background:transparent;border:0;box-shadow:none;text-decoration:underline;text-underline-offset:4px;font:600 17px "Baloo 2",sans-serif}
  .arcade-field-heading{font:400 22px/1.2 "Luckiest Guy",sans-serif;margin:0 0 10px}
  .arcade-field-label{display:block;margin:12px 0 8px}
  .arcade-difficulties{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .arcade-difficulties .arcade-button{margin:0;min-height:46px;font-size:17px;padding:11px 4px;border-radius:8px}
  .arcade-difficulties [aria-pressed=true]{background:#ffd158;color:#211809;border-color:#fff2ce;box-shadow:0 2px 0 #906018}
  .arcade-description{color:#d2dfd9;font-size:15px;line-height:1.4;margin:10px 0 14px}
  .arcade-profile .arcade-description{min-height:40px;margin-bottom:4px}
  .arcade-input{box-sizing:border-box;width:100%;min-height:48px;padding:12px;border:2px solid #708188;border-radius:9px;background:#fff2da;color:#172831;font:600 18px "Baloo 2",sans-serif;user-select:text;touch-action:manipulation}
  .arcade-input::placeholder{color:#64604f;opacity:1}
  .arcade-appearance{display:flex;align-items:center;justify-content:center;gap:28px;margin:16px 0}
  .arcade-swatch{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;cursor:pointer}
  .arcade-error{min-height:20px;color:#ffe28a;font-size:15px;margin:4px 0}
  .arcade-ranking{margin:0 0 24px;padding-left:26px}
  .arcade-ranking li{padding:16px 0;border-bottom:1px solid #41616c}
  .arcade-ranking li::marker{color:#ffd158}
  .arcade-ranking li span{display:inline-block;max-width:65%;overflow-wrap:anywhere}
  .arcade-ranking strong{float:right;color:#ffd158;font-weight:600}
  .arcade-share-formats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .arcade-share-formats .arcade-button{font:600 16px "Baloo 2",sans-serif;margin:0;box-shadow:none}
  .arcade-share-formats [aria-pressed=true]{background:#ffd158;color:#211809;border-color:#fff2ce}
  .arcade-share-preview{display:block;box-sizing:border-box;width:100%;max-height:240px;object-fit:contain;background:#0d2028;border-radius:10px;margin:18px 0}
  .arcade-share-text{margin:18px 0 0;user-select:text}
  .arcade-share-text summary{min-height:44px;cursor:pointer;color:#d2dfd9;touch-action:manipulation}
  .arcade-share-text textarea{height:132px;font-size:16px;margin-top:8px}
  @media(max-width:359px),(max-height:680px){.arcade-dialog{padding:18px}.arcade-mini-logo{width:108px;margin-bottom:14px}.arcade-heading{font-size:25px;margin-bottom:18px}.arcade-appearance{margin:10px 0}.arcade-appearance canvas{max-height:108px;object-fit:contain}.arcade-button{margin-top:12px}.arcade-field-heading{font-size:20px}}
</style>
</head>

<div id="rotate">Gira el teléfono 📱<br>Se juega en vertical</div>

/** Recorta únicamente el margen transparente al preparar el sprite.
 * El probe pequeño evita leer todos los megapíxeles en un teléfono.
 * Contain mantiene la proporción del retrato/vehículo aprobado.
 */
function approvedSprite(img, lw, lh) {
    const iw = img.naturalWidth || img.width || 1, ih = img.naturalHeight || img.height || 1;
    const ratio = Math.min(1, 320 / Math.max(iw, ih));
    const probe = document.createElement('canvas');
    probe.width = Math.max(1, Math.ceil(iw * ratio));
    probe.height = Math.max(1, Math.ceil(ih * ratio));
    const pg = probe.getContext('2d', { willReadFrequently: true });
    pg.drawImage(img, 0, 0, probe.width, probe.height);
    let bx = 0, by = 0, bw = iw, bh = ih;
    try {
        const data = pg.getImageData(0, 0, probe.width, probe.height).data;
        let x0 = probe.width, y0 = probe.height, x1 = -1, y1 = -1;
        for (let y = 0; y < probe.height; y++)
            for (let x = 0; x < probe.width; x++) {
                if (data[(y * probe.width + x) * 4 + 3] < 100)
                    continue;
                x0 = Math.min(x0, x);
                y0 = Math.min(y0, y);
                x1 = Math.max(x1, x);
                y1 = Math.max(y1, y);
            }
        if (x1 >= x0 && y1 >= y0) {
            bx = Math.max(0, (x0 - 1) / ratio);
            by = Math.max(0, (y0 - 1) / ratio);
            bw = Math.min(iw - bx, (x1 - x0 + 3) / ratio);
            bh = Math.min(ih - by, (y1 - y0 + 3) / ratio);
        }
    }
    catch (_) { /* El arte local y los mocks conservan una ruta segura. */ }
    const scale = Math.min((lw - 4) / bw, (lh - 4) / bh);
    const w = bw * scale, h = bh * scale;
    return makeSprite(lw, lh, g => {
        g.imageSmoothingEnabled = true;
        g.imageSmoothingQuality = 'high';
        g.drawImage(img, bx, by, bw, bh, (lw - w) / 2, (lh - h) / 2, w, h);
    }, 2);
}
function approvedFrames(img, lw, lh, count, fallback, motion = true) {
    if (!img)
        return Array.from({ length: count }, (_, i) => fallback(i));
    const base = approvedSprite(img, lw, lh);
    // Desplazamiento mínimo: respiración/marcha sin deformar las caras.
    return Array.from({ length: count }, (_, i) => makeSprite(lw, lh, g => {
        g.save();
        g.translate(lw / 2, lh / 2 + (motion ? Math.sin((i + 0.25) / count * TAU) * 0.7 : 0));
        if (motion)
            g.rotate(Math.sin(i / count * TAU + 0.4) * 0.018);
        g.drawImage(base, -lw / 2, -lh / 2, lw, lh);
        g.restore();
    }, 2));
}

    grad.addColorStop(.65, charge > .3 ? '#de493c' : '#bc775c');
    grad.addColorStop(1, charge > .3 ? '#8c382e' : '#a06048');

    g.fill();
    g.strokeStyle = '#8b652b';
    g.lineWidth = 1;
    g.stroke();
    acneOval(g, -r * .25, -r * .2, r * .2, r * .3);
    g.fillStyle = '#fff8d9';

    g.restore();
}
/** Coordinates are relative to the approved 230 × 185 portrait's top-left. */
function drawRandyAcne(g, t, group, reducedMotion = false) {
    RANDY_ACNE.spots.forEach((spot, i) => {
        const index = group.indexOf(i), pop = RANDY_ACNE.popAt + Math.max(0, index) * RANDY_ACNE.popGap;
        const burst = index >= 0 && t >= pop, charge = index < 0 ? 0 : Math.max(0, Math.min(1, (t - RANDY_ACNE.chargeStart) / (RANDY_ACNE.popAt - RANDY_ACNE.chargeStart)));
        drawRandyPimple(g, spot, charge, burst, t - pop, t, reducedMotion);
    });
    if (reducedMotion)
        return;
    group.forEach((id, k) => {
        const spot = RANDY_ACNE.spots[id], elapsed = t - (RANDY_ACNE.popAt + k * RANDY_ACNE.popGap);
        if (elapsed < 0 || elapsed > .45)
            return;
        if (elapsed < .13) {
            g.save();
            g.globalAlpha *= 1 - elapsed / .13;
            g.strokeStyle = '#fff5be';
            g.lineWidth = 1.4;
            for (let i = 0; i < 6; i++) {
                const a = i * Math.PI / 3, r = 6 + elapsed * 35;
                g.beginPath();
                g.moveTo(spot.x + Math.cos(a) * r, spot.y + Math.sin(a) * r);
                g.lineTo(spot.x + Math.cos(a) * (r + 4), spot.y + Math.sin(a) * (r + 4));
                g.stroke();
            }
            g.restore();
        }
        for (let i = 0; i < 5; i++) {
            const a = i * 2.4 + k, r = 28 * elapsed, x = spot.x + Math.cos(a) * r, y = spot.y + Math.sin(a) * r + elapsed * elapsed * 15;
            g.save();
            g.globalAlpha *= 1 - elapsed / .45;
            acneOval(g, x, y, 1.3, 1);
            g.fillStyle = '#f0d278';
            g.fill();
            g.restore();
        }
    });
}

        if (cv)
            return cv;
        cv = document.createElement('canvas');
        cv.width = Math.ceil(540 * this.rs);
        cv.height = Math.ceil(CHUNK * this.rs);
        const g = cv.getContext('2d');
        g.scale(this.rs, this.rs);
        g.lineJoin = 'round';
        g.lineCap = 'round';
        const y0 = c * CHUNK, y1 = y0 + CHUNK;
        this.groundAt(g, y0, y1, c);
        // orden: techos → árboles/palmas → resto; los de mayor y (más arriba) primero
        const list = this.objs.filter(o => { const [a, b] = this.objBounds(o); return b > y0 - 60 && a < y1 + 60; });
        const order = (t) => (t === 'crosswalk' ? 0 : t === 'roof' || t === 'ministry' || t === 'terrace' ? 1 : t === 'memorial' ? 2 : t === 'car' ? 3 : t === 'lamp' || t === 'bench' ? 4 : t === 'billboard' ? 6 : 5);
        list.sort((a, b) => order(a.t) - order(b.t) || b.y - a.y);
        for (const o of list)
            this.drawObj(g, o, c);

        if (this.chunks.size > 7) {
            const keys = Array.from(this.chunks.keys()).sort((a, b) => Math.abs(a - c) - Math.abs(b - c));

    warm(scroll, H) {

            return;

        for (let c = c0; c <= c1; c++)
            if (!this.chunks.has(c)) {
                this.getChunk(c);

            }

    draw(g, scroll, H, time) {
        const plate = this.plate || ART.plazaPlate;
        if (plate) {
            // A single authored scenic view keeps the actual landmarks recognizable.
            // The gentle camera traverse reveals the far end without repeating buildings.
            // Continuous, slow camera travel, including during the final boss.
            // Ease toward the edge so the authored panorama never exposes a gap.
            const plateH = H + 420, top = -420 * Math.exp(-Math.max(0, time) / 150);
            g.drawImage(plate, 0, top, 540, plateH);
            for (const s of this.splats) {
                const sy = H - (s.y - scroll);
                if (sy > -60 && sy < H + 60)
                    drawSprite(g, ART.groundSplats[s.i], s.x, sy, s.r, 1, 1, .65);
            }
            return;
        }
        const c0 = Math.floor(scroll / CHUNK), c1 = Math.floor((scroll + H) / CHUNK);
        for (let c = c0; c <= c1; c++) {
            const cv = this.getChunk(c);
            const screenTop = H - ((c + 1) * CHUNK - scroll);
            g.drawImage(cv, 0, Math.floor(screenTop * 100) / 100, 540, CHUNK + 0.5);
        }
        // manchas en el piso (efecto de nuestras bombas)
        for (const s of this.splats) {
            const sy = H - (s.y - scroll);
            if (sy < -60 || sy > H + 60)
                continue;
            drawSprite(g, ART.groundSplats[s.i], s.x, sy, s.r, 1, 1, 0.8);
        }
        // banderas animadas
        const f = Math.floor(time * 6);
        for (const p of this.props) {

            if (sy < -60 || sy > H + 60)
                continue;
            drawSprite(g, ART.flag[(f + p.s) % 3], p.x + 10, sy - 18);
        }

        // dibujan después, con toda su luz. Una sola pasada suave.
        g.save();
        const edge = g.createLinearGradient(0, 0, 540, 0);
        edge.addColorStop(0, 'rgba(60,43,25,0.14)');
        edge.addColorStop(0.22, 'rgba(60,43,25,0)');
        edge.addColorStop(0.78, 'rgba(60,43,25,0)');
        edge.addColorStop(1, 'rgba(60,43,25,0.14)');

        g.restore();

            c.y += c.s * dt;
            c.x += c.s * 0.3 * dt;
            if (c.y - c.r > H) {
                c.y = -c.r - Math.random() * 300;

            ellipse(g, c.x, c.y, c.r, c.r * 0.6);

            ellipse(g, c.x + c.r * 0.5, c.y + 20, c.r * 0.6, c.r * 0.4);

        }

    }
}

            drawSprite(g, ART.bandage, c.x + (side === 'L' ? -1 : 1), c.y + lh / 2 - cutL + 2, side === 'L' ? 0.5 : -0.6, 1, 1);
        }
        if (this.flash > 0) {
            g.globalAlpha = Math.min(1, this.flash * 6);
            g.drawImage(ART.playerWhite, 0, 0, sw, cutS, -lw / 2, -cutL, lw, cutL);
            g.globalAlpha = 1;
        }
        g.restore();
        g.restore();
    }
    /** Mitades para la muerte (culo partido). */
    halfSprites() {
        const spr = PLAYER_APPEARANCE.sprite(this.skin);
        const sw = spr.width, sh = spr.height, cutS = Math.round(PGEO.cutSrcY * sh);
        const mk = (sx, w, sy, h) => {
            const c = document.createElement('canvas');
            c.width = w;
            c.height = h;
            c.lw = w * (spr.lw / sw);
            c.lh = h * (spr.lh / sh);
            const g = c.getContext('2d');
            g.drawImage(spr, sx, sy, w, h, 0, 0, w, h);
            // curitas quemadas en la mitad correspondiente
            return c;
        };
        const half = Math.round(sw / 2);
        return [mk(0, half, 0, cutS), mk(half, sw - half, 0, cutS), mk(0, sw, Math.round(PGEO.capeSrcY * sh), sh - Math.round(PGEO.capeSrcY * sh))];
    }
}

/* =====================================================================
 * ENTIDADES — enemigos, balas, disparos del jugador, pickups, bombas.
 * ===================================================================== */
let PLAY = null; // escena de juego activa
class Enemy {
    constructor(kind) {
        this.alive = true;
        this.x = 0;
        this.y = 0;
        this.hp = 1;
        this.maxHp = 1;
        this.r = 20;
        this.t = 0;
        this.fireCd = 2;
        this.flash = 0;
        this.mode = 'walk';
        this.path = null;
        this.pathDur = 99;
        this.delay = 0;
        this.phase = Math.random() * TAU;
        this.rot = 0;
        this.vx = 0;
        this.vy = 0;
        this.carrier = false;
        this.decals = [];
        this.ground = true;
        this.entered = false;
        this.holdY = 0;
        this.holdT = 0;
        this.state = 0;
        this.strafe = 0;
        this.shieldHp = 0;
        this.variant = randi(0, 2);
        this.kind = kind;
        this.cfg = CONFIG.enemies[kind];
        const d = PLAY.diff;
        this.hp = this.maxHp = this.cfg.hp * (kind === 'jaba' ? 1 : d.enemyHp);
        this.r = this.cfg.radius;
        this.fireCd = rangeRand(this.cfg.fireEvery || [2, 3]) / d.fireRate * rand(0.6, 1.1);
        this.ground = kind !== 'ciberclaria' && kind !== 'jaba';
    }
    targetable() { return this.alive && this.y > -20 && this.y < PLAY.H + 10; }
    update(dt) {
        this.t += dt;
        if (this.flash > -1)
            this.flash -= dt;
        const H = PLAY.H, sv = PLAY.scrollV;
        const c = this.cfg;
        const ag = PLAY.diff.aggression;
        switch (this.mode) {
            case 'path': {
                const p = this.path(this.t);
                this.vx = (p.x - this.x) / Math.max(dt, 1e-4);
                this.vy = (p.y - this.y) / Math.max(dt, 1e-4);
                this.x = p.x;
                this.y = p.y;
                break;
            }
            case 'walk': {
                let v = c.speed;
                if (this.holdY && this.state === 0 && this.y >= this.holdY) {
                    this.state = 1;
                    this.holdT = rand(2.2, 3.4);
                }
                if (this.state === 1) {
                    v = -sv * 0.0;
                    this.holdT -= dt;
                    if (this.holdT <= 0)
                        this.state = 2;
                    this.y += 0;
                }
                this.y += (this.state === 1 ? 0 : v + sv) * dt;
                this.x += Math.sin(this.t * 1.6 + this.phase) * 16 * dt;
                break;
            }
            case 'rush': {
                if (this.t < this.delay) {
                    this.y += (c.speed + sv) * dt;
                    break;
                }
                const p = PLAY.player;
                const want = angleTo(this.x, this.y, p.x, p.y);
                if (this.state === 0) {
                    this.rot = want;
                    this.state = 1;
                }
                let diff = want - this.rot;
                while (diff > Math.PI)
                    diff -= TAU;
                while (diff < -Math.PI)
                    diff += TAU;
                if (this.y < p.y - 60)
                    this.rot += clamp(diff, -2.2 * dt, 2.2 * dt);
                const s = c.rushSpeed * (0.85 + 0.25 * ag);
                this.x += Math.cos(this.rot) * s * dt;
                this.y += Math.sin(this.rot) * s * dt + sv * dt * 0.3;
                break;
            }
            case 'drive': {
                if (this.state === 0) {
                    const dy = this.holdY - this.y;
                    this.y += Math.max(30, Math.min(c.speed * 3.2, dy * 2.2)) * dt;
                    if (dy < 6) {
                        this.state = 1;
                        this.holdT = c.holdTime;
                    }
                }
                else if (this.state === 1) {
                    this.holdT -= dt;
                    this.strafe += dt;
                    const tx = clamp(PLAY.player.x, 90, 450);
                    this.x = approach(this.x, tx, c.speed * 0.7 * dt);
                    this.rot = clamp((tx - this.x) * 0.004, -0.12, 0.12);
                    if (this.holdT <= 0)
                        this.state = 2;
                }
                else {
                    this.rot *= 0.9;
                    this.y += (c.speed * 2.6) * dt;
                }
                break;
            }
            case 'cross': {
                this.x += this.vx * dt;
                this.y += Math.sin(this.t * 2.2) * 30 * dt + 12 * dt;
                break;
            }
        }
        if (!this.entered && this.y > 10 && this.y < H && this.x > -10 && this.x < 550)
            this.entered = true;
        // disparo
        if (this.cfg.fireEvery && this.entered) {
            this.fireCd -= dt;
            if (this.fireCd <= 0) {
                this.fireCd = rangeRand(this.cfg.fireEvery) / PLAY.diff.fireRate;
                if (this.y > 30 && this.y < H * 0.68 && PLAY.canEnemiesFire()) {
                    const p = PLAY.player;
                    if (dist2(this.x, this.y, p.x, p.y) > 150 * 150)
                        this.fire();
                }
            }
        }
        // fuera de pantalla
        const m = 120;
        if (this.entered && (this.y > H + m || this.y < -m * 2 || this.x < -m || this.x > 540 + m))
            this.alive = false;
        if (!this.entered && this.t > 14)
            this.alive = false;
        if (this.mode === 'path' && this.t > this.pathDur)
            this.alive = false;
    }
    fire() {
        const p = PLAY.player;
        const sp = this.cfg.bulletSpeed * PLAY.diff.bulletSpeed;
        const a = angleTo(this.x, this.y, p.x, p.y);
        switch (this.kind) {
            case 'ciberclaria':
                PLAY.eBullet(this.x, this.y + 22, Math.cos(a) * sp * 0.9, Math.sin(a) * sp * 0.9, 'orb');
                break;
            case 'police':
                PLAY.eBullet(this.x + 14, this.y + 12, Math.cos(a) * sp, Math.sin(a) * sp, 'orb');
                break;
            case 'army':
                PLAY.eBullet(this.x - 6, this.y + 16, 0, sp, 'long');
                PLAY.eBullet(this.x + 6, this.y + 16, 0, sp, 'long');
                break;
            case 'troop':
                for (const da of [-0.14, 0.14])
                    PLAY.eBullet(this.x, this.y + 22, Math.cos(a + da) * sp, Math.sin(a + da) * sp, 'orb');
                break;
            case 'special':
                // Ráfaga con dirección fija: permite leerla y salir de la línea.
                for (let i = 0; i < 3; i++)
                    setTimeoutGame(() => { if (this.alive && PLAY.canEnemiesFire())
                        PLAY.eBullet(this.x, this.y + 16, Math.cos(a) * sp, Math.sin(a) * sp, 'long'); }, i * 0.18);
                break;
            case 'lada':
                for (const da of [-0.28, 0, 0.28])
                    PLAY.eBullet(this.x, this.y + 50, Math.cos(a + da) * sp, Math.sin(a + da) * sp, 'orb');
                break;
            case 'riot': {
                const n = 5, base = Math.PI / 2 + Math.sin(this.t * 0.9) * 0.45;
                for (let i = 0; i < n; i++) {
                    const b = base + (i - (n - 1) / 2) * 0.22;
                    PLAY.eBullet(this.x, this.y + 62, Math.cos(b) * sp, Math.sin(b) * sp, 'big');
                }
                break;
            }
        }
    }
    hurt(dmg, hx, hy, src = 'shot') {
        if (!this.alive)
            return;
        if (this.kind === 'troop' && src === 'shot' && hy > this.y + 4 && this.shieldHp > 0) {
            this.shieldHp -= dmg;
            dmg *= 0.5;
            if (this.shieldHp <= 0) {
                AUDIO.play('thunk');
                PLAY.fx.ring(this.x, this.y + 16, 45, '#bcf3ff', .3, 3);
                PLAY.fx.text('¡SIN ESCUDO!', this.x, this.y - 38, 16, '#bceaff', .8);
            }
        }
        this.hp -= dmg;
        if (this.flash < -0.07)
            this.flash = 0.06;
        const heavy = this.kind === 'lada' || this.kind === 'riot';
        AUDIO.play(heavy ? 'hitMetal' : 'hit');
        if ((heavy || this.kind === 'troop') && this.decals.length < 12 && Math.random() < 0.35) {
            const rr = this.r * 0.75;
            this.decals.push({ x: clamp(hx - this.x, -rr, rr), y: clamp(hy - this.y, -rr * 1.3, rr * 1.3), i: randi(0, 3), r: Math.random() * TAU });
        }
        if (this.hp <= 0)
            this.kill(src);
    }
    kill(src = 'shot') {
        if (!this.alive)
            return;
        this.alive = false;
        const c = this.cfg;
        PLAY.addScore(c.score, this.x, this.y);
        PLAY.addMeter(c.meter);
        PLAY.kills++;
        const fx = PLAY.fx;
        switch (this.kind) {
            case 'ciberclaria':
                AUDIO.play('splat');
                fx.poopBurst(this.x, this.y, 10, 180, 4);
                fx.corpse(ART.claria[0], this.x, this.y, { spin: rand(-8, 8), vy: -40, vx: rand(-60, 60), life: 0.45, splat: true });
                if (Math.random() < 0.18)
                    fx.text(pick(['¡PLOF!', '¡SPLAT!', '¡FLOP!']), this.x, this.y - 20, 26, '#ffe066', 0.6);
                break;
            case 'police':
            case 'army':
            case 'troop':
            case 'special':
                AUDIO.play('oof');
                fx.poopBurst(this.x, this.y, 8, 150, 4);
                fx.corpse(this.kind === 'police' && ART.policeVariants ? ART.policeVariants[this.variant][0] : ART[this.kind][0], this.x, this.y, { rot: 0, spin: 0, sx: 1.1, sy: 0.55, life: 0.9, ground: true, splat: true });
                if (Math.random() < 0.12)
                    fx.text(pick(['¡AGH!', '¡PUAJ!', '¡QUÉ PESTE!']), this.x, this.y - 24, 22, '#fff', 0.6);
                break;
            case 'lada':
            case 'riot': {
                AUDIO.play('boom');
                const big = this.kind === 'riot';
                PLAY.shake(big ? 14 : 9);
                PLAY.hitstop(big ? 0.09 : 0.05);
                fx.puff(this.x, this.y, big ? 14 : 9, ART.puffDark, big ? 46 : 34, 1.1, 90);
                fx.puff(this.x, this.y, 6, ART.puffBrown, 30, 0.8, 120);
                fx.spark(this.x, this.y, 6, 40);
                fx.burst(this.x, this.y, 18, '#ffcc44', 320, 4, 0.5, 200);
                fx.ring(this.x, this.y, big ? 150 : 100, '#fff2b0', 0.4, 8);
                fx.text(big ? '¡KABRUUUM!' : '¡PUM!', this.x, this.y - 30, big ? 44 : 36, '#ffb52e', 0.9);
                const spr = (big ? ART.riot : ART.lada)[0];
                fx.corpse(spr, this.x, this.y, { life: 0.8, ground: true, splat: true, sx: 1, sy: 1, rot: this.rot });
                PLAY.bg.addGroundSplat(this.x, PLAY.scroll + PLAY.H - this.y);
                break;
            }
            case 'jaba':
                AUDIO.play('splat');
                fx.burst(this.x, this.y, 12, '#f7d0e0', 200, 4, 0.5, 300);
                fx.ring(this.x, this.y, 50, '#ffe066', 0.3, 4);
                break;
        }
        // drops
        if (this.carrier || this.kind === 'jaba')
            PLAY.dropPickup(this.x, this.y, null);
        else if (src !== 'tanketa' && Math.random() < CONFIG.pickups.randomDropChance)
            PLAY.dropPickup(this.x, this.y, null);
    }
    draw(g) {
        const fl = this.flash > 0;
        const f2 = Math.floor(PLAY.time * 5 + this.phase) % 2;
        switch (this.kind) {
            case 'ciberclaria': {
                const fr = Math.floor(PLAY.time * 8 + this.phase * 2) % 4;
                // sombra en el piso (flota)
                g.fillStyle = 'rgba(20,15,10,0.18)';
                ellipse(g, this.x + 14, this.y + 30, 16, 6);
                g.fill();
                const rot = clamp(Math.atan2(this.vy, this.vx) - Math.PI / 2, -0.7, 0.7) * (Math.hypot(this.vx, this.vy) > 30 ? 1 : 0);
                drawSprite(g, fl ? ART.clariaWhite[fr] : ART.claria[fr], this.x, this.y, rot * 0.8);
                break;
            }
            case 'police':
            case 'army':
            case 'troop':
            case 'special': {
                const rot = this.mode === 'rush' && this.t >= this.delay ? this.rot - Math.PI / 2 : 0;
                const frames = this.kind === 'police' && ART.policeVariants ? (fl ? ART.policeVariantsWhite[this.variant] : ART.policeVariants[this.variant]) : ART[this.kind + (fl ? 'White' : '')];
                drawSprite(g, frames[f2], this.x, this.y, rot);
                // La ilustración de la brigada ya incluye el escudo; halo muestra resistencia.
                if (this.kind === 'troop' && this.shieldHp > 0) {
                    g.save();
                    g.strokeStyle = 'rgba(128,211,235,.45)';
                    g.lineWidth = 2;
                    g.beginPath();
                    g.arc(this.x, this.y + 10, 22, 0.25, Math.PI - 0.25);
                    g.stroke();
                    g.restore();
                }
                break;
            }
            case 'lada': {
                if (f2 === 0) {
                    g.save();
                    g.globalCompositeOperation = 'lighter';
                    drawSprite(g, ART.ladaGlow, this.x, this.y - 12, 0, 1, 1, 0.5);
                    g.restore();
                }
                drawSprite(g, fl ? ART.ladaWhite[f2] : ART.lada[f2], this.x, this.y, this.rot);
                break;
            }
            case 'riot':
                drawSprite(g, fl ? ART.riotWhite[f2] : ART.riot[f2], this.x, this.y, this.rot);
                break;
            case 'jaba':
                g.fillStyle = 'rgba(20,15,10,0.15)';
                ellipse(g, this.x + 12, this.y + 34, 12, 4);
                g.fill();
                // brillo de "tengo premio"
                g.save();
                g.globalAlpha = 0.35 + 0.25 * Math.sin(PLAY.time * 8);
                g.fillStyle = '#fff3a0';
                ellipse(g, this.x, this.y, 30, 30);
                g.fill();
                g.restore();
                drawSprite(g, fl ? ART.jabaWhite[f2] : ART.jaba[f2], this.x, this.y, Math.sin(this.t * 3) * 0.15);
                break;
        }
        if (this.carrier && this.kind !== 'jaba') {
            g.save();
            g.globalAlpha = 0.5 + 0.4 * Math.sin(PLAY.time * 10);
            g.strokeStyle = '#ffe066';
            g.lineWidth = 3;
            ellipse(g, this.x, this.y, this.r + 8, this.r + 8);
            g.stroke();
            g.restore();
        }
        for (const d of this.decals)
            drawSprite(g, ART.splats[d.i], this.x + d.x, this.y + d.y, d.r, 0.8, 0.8);
    }
}
// ------------------------------------------------------------ timers de juego (se pausan con el juego)
const GAME_TIMERS = [];
function setTimeoutGame(fn, sec) { GAME_TIMERS.push({ t: sec, fn }); }
function tickGameTimers(dt) {
    for (let i = GAME_TIMERS.length - 1; i >= 0; i--) {
        GAME_TIMERS[i].t -= dt;
        if (GAME_TIMERS[i].t <= 0) {
            const f = GAME_TIMERS[i].fn;
            GAME_TIMERS.splice(i, 1);
            f();
        }
    }
}

/* =====================================================================
 * LA MACHI → SANDRO → RANDY. Todos los ataques anuncian su intención.
 * ===================================================================== */
class SpeechBubble {
    constructor() {
        this.text = '';
        this.t = 0;
        this.life = 0;
    }
    say(text, life = 2.2) { this.text = text; this.t = 0; this.life = life; }
    update(dt) { if (this.life > 0) {
        this.t += dt;
        if (this.t >= this.life)
            this.life = 0;
    } }
    draw(g, x, y, tailDown = true) {
        if (this.life <= 0)
            return;
        const k = this.t / this.life;
        const pop = this.t < 0.18 ? easeOutBack(this.t / 0.18) : 1;
        const a = k > 0.85 ? 1 - (k - 0.85) / 0.15 : 1;
        g.save();
        g.globalAlpha = a;
        g.font = `20px ${FONT}`;
        const lines = wrapText(g, this.text, 250);
        const w = Math.max(...lines.map(l => g.measureText(l).width)) + 30, h = lines.length * 24 + 18;
        const bx = clamp(x, w / 2 + 10, 540 - w / 2 - 10);
        g.translate(bx, y);
        g.scale(pop, pop);
        roundRect(g, -w / 2, -h, w, h, 16);
        g.fillStyle = '#fffdf5';
        g.fill();
        g.strokeStyle = INK;
        g.lineWidth = 3;
        g.stroke();
        const tx = clamp(x - bx, -w / 2 + 20, w / 2 - 20);
        if (tailDown) {
            g.beginPath();
            g.moveTo(tx - 10, -1.5);
            g.lineTo(tx + 4, 16);
            g.lineTo(tx + 12, -1.5);
            g.closePath();
            g.fillStyle = '#fffdf5';
            g.fill();
            g.beginPath();
            g.moveTo(tx - 10, 0);
            g.lineTo(tx + 4, 16);
            g.lineTo(tx + 12, 0);
            g.stroke();
        }
        else {
            g.beginPath();
            g.moveTo(tx - 10, -h + 1.5);
            g.lineTo(tx + 4, -h - 15);
            g.lineTo(tx + 12, -h + 1.5);
            g.closePath();
            g.fillStyle = '#fffdf5';
            g.fill();
            g.beginPath();
            g.moveTo(tx - 10, -h);
            g.lineTo(tx + 4, -h - 15);
            g.lineTo(tx + 12, -h);
            g.stroke();
        }
        g.fillStyle = INK;
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        lines.forEach((l, i) => g.fillText(l, 0, -h + 20 + i * 24));
        g.restore();
    }
}
function wrapText(g, text, maxW) {
    const words = text.split(' ');
    const out = [];
    let cur = '';
    for (const w of words) {
        const t = cur ? cur + ' ' + w : w;
        if (g.measureText(t).width > maxW && cur) {
            out.push(cur);
            cur = w;
        }
        else
            cur = t;
    }
    if (cur)
        out.push(cur);
    return out;
}
function drawAimCue(g, x, y, tx, ty, t, color) {
    g.save();
    g.globalAlpha = 0.35 + Math.sin(t * 15) * 0.12;
    g.strokeStyle = color;
    g.lineWidth = 2;
    g.setLineDash([8, 12]);
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(tx, ty);
    g.stroke();
    g.setLineDash([]);
    g.globalAlpha = 0.7;
    g.beginPath();
    g.arc(tx, ty, 20 + Math.sin(t * 14) * 3, 0, TAU);
    g.stroke();
    g.restore();
}
// =====================================================================
class Machi {
    constructor() {
        this.alive = true;
        this.x = 270;
        this.y = -150;
        this.r = CONFIG.machi.radius;
        this.state = 'enter';
        this.st = 0;
        this.t = 0;
        this.flash = 0;
        this.tx = 0;
        this.ty = 0;
        this.vx = 0;
        this.vy = 0;
        this.rot = 0;
        this.scale = 1;
        this.bubble = new SpeechBubble();
        this.charges = 0;
        this.decals = [];
        this.gone = false;
        this.hp = this.maxHp = CONFIG.machi.hp * PLAY.diff.enemyHp;
        this.bubble.say(CONFIG.lines.machiIntro, 2.4);
        AUDIO.speak(CONFIG.lines.machiIntro, 1.35, 1.1);
    }
    targetable() { return this.alive && this.state !== 'enter' && this.state !== 'dying' && this.state !== 'exit'; }
    handbagOrigin() {
        // El aviso y las carteras salen del mismo punto del objeto que sostiene.
        const o = CONFIG.machi.handbagOrigin, c = Math.cos(this.rot), s = Math.sin(this.rot);
        return { x: this.x + (o.x * c - o.y * s) * this.scale,
            y: this.y + Math.sin(this.t * 3) * 4 + (o.x * s + o.y * c) * this.scale };
    }
    hurt(dmg, hx, hy, src = 'shot') {
        if (!this.targetable())
            return;
        this.hp -= dmg;
        if (this.flash < -0.08)
            this.flash = 0.06;
        AUDIO.play('bossHit');
        if (this.decals.length < 14 && Math.random() < 0.2)
            this.decals.push({ x: clamp(hx - this.x, -34, 34), y: clamp(hy - this.y, -40, 40), i: randi(0, 3), r: Math.random() * TAU });
        if (Math.random() < 0.012 && this.bubble.life <= 0) {
            this.bubble.say('¡Ay, qué peste!', 1.6);
        }
        if (this.hp <= 0)
            this.die();

    die() {

        PLAY.clearEnemyBullets(true);
        PLAY.addScore(CONFIG.machi.score, this.x, this.y);
        PLAY.addMeter(CONFIG.machi.meter);

        PLAY.hitstop(0.1);

        PLAY.fx.ring(this.x, this.y, 160, '#ffe066', 0.5, 8);
        PLAY.fx.text('¡MACHI FUERA!', this.x, this.y - 70, 40, '#ff8ad1', 1.3);
        PLAY.dropPickup(this.x, this.y, 'life');
    }
    update(dt) {
        this.t += dt;
        this.st += dt;
        if (this.flash > -1)
            this.flash -= dt;
        this.bubble.update(dt);
        const p = PLAY.player;
        const M = CONFIG.machi;
        const ag = PLAY.diff.aggression;
        const hoverY = M.hoverY + PLAY.safeTop;
        switch (this.state) {
            case 'enter':
                this.y = lerp(-150, hoverY, easeOutBack(Math.min(1, this.st / 1.3)));
                this.x = 270 + Math.sin(this.st * 2) * 30;
                if (this.st >= 1.3) {
                    this.state = 'hover';
                    this.st = 0;
                }
                break;
            case 'hover':
                this.x = lerp(this.x, 270 + Math.sin(this.t * 1.4) * 170, dt * 2.5);
                this.y = lerp(this.y, hoverY + Math.sin(this.t * 2.3) * 25, dt * 3);
                this.rot = Math.sin(this.t * 3) * 0.12;
                if (this.st > 1.4 / Math.max(0.6, ag)) {
                    this.state = 'telegraph';
                    this.st = 0;
                    this.tx = p.x;
                    this.ty = p.y - 18;
                    AUDIO.play('machi');
                }
                break;
            case 'telegraph':
                this.rot = Math.sin(this.st * 50) * 0.08;
                if (this.st > M.telegraphTime / Math.max(0.7, ag)) {
                    this.state = 'throw';
                    this.st = 0;
                    const origin = this.handbagOrigin();
                    const a = angleTo(origin.x, origin.y, this.tx, this.ty);
                    const speed = M.handbagSpeed * PLAY.diff.bulletSpeed;
                    const n = this.hp < this.maxHp * 0.5 ? 2 : 1;
                    for (let i = -n; i <= n; i++) {
                        const aim = a + i * 0.24;
                        PLAY.eBullet(origin.x, origin.y, Math.cos(aim) * speed, Math.sin(aim) * speed, 'handbag');
                    }
                    AUDIO.play('handbag');
                    this.charges++;
                    if (this.charges % 2 === 0) {
                        const l = CONFIG.lines.machi[(this.charges / 2 - 1) % CONFIG.lines.machi.length];
                        this.bubble.say(l, 2.2);
                        AUDIO.speak(l, 1.35, 1.15);
                    }
                }
                break;
            case 'throw':
                this.rot = Math.sin(this.st * 12) * 0.12;
                if (this.st > 0.35) {
                    this.state = 'recover';
                    this.st = 0;
                }
                break;
            case 'recover':
                this.rot = lerp(this.rot % TAU, 0, dt * 5);
                this.x = lerp(this.x, clamp(this.x, 90, 450), dt * 2);
                this.y = lerp(this.y, hoverY, dt * 2.2);
                if (this.st > M.restTime) {
                    this.state = 'hover';
                    this.st = 0;
                }
                break;
            case 'exit':
                this.y -= 260 * dt;
                this.rot = Math.sin(this.st * 12) * 0.2;
                if (this.y < -160) {
                    this.alive = false;
                    this.gone = true;
                }
                break;
            case 'dying':
                this.rot += dt * 14;
                this.scale = Math.max(0, 1 - this.st / 1.2);
                this.y -= 60 * dt;
                if (this.st > 1.25) {
                    this.alive = false;
                }
                break;
        }
        // choque con el jugador
        if (this.state !== 'dying' && this.state !== 'enter' && this.state !== 'exit' && p.alive && dist2(this.x, this.y, p.x, p.y) < (this.r + CONFIG.player.hitRadius + 8) ** 2) {
            PLAY.hurtPlayer(this.x);
        }
    }
    draw(g) {
        if (!this.alive)
            return;
        const bob = Math.sin(this.t * 3) * 4;
        g.fillStyle = 'rgba(20,15,10,0.2)';
        ellipse(g, this.x + 20, this.y + 90, 50 * this.scale, 12 * this.scale);
        g.fill();
        let spr = ART.machi;
        const tele = this.state === 'telegraph';
        if (tele) {
            const origin = this.handbagOrigin();
            drawAimCue(g, origin.x, origin.y, this.tx, this.ty, this.st, '#ff91c8');
        }
        drawSprite(g, spr, this.x, this.y + bob, this.rot, this.scale, this.scale);
        if (this.flash > 0 && !APP.reducedMotion)
            drawSprite(g, ART.machiWhite, this.x, this.y + bob, this.rot, this.scale, this.scale, .3);
        if (tele) {
            g.save();
            g.globalAlpha = 0.35 + 0.3 * Math.sin(this.st * 30);
            drawSprite(g, ART.machiRed, this.x, this.y + bob, this.rot, this.scale, this.scale);
            g.restore();
            comicText(g, '!', this.x + 78, this.y - 65, 44, '#ff3b30');
        }
        for (const d of this.decals) {
            const c = Math.cos(this.rot), s = Math.sin(this.rot);
            drawSprite(g, ART.splats[d.i], this.x + (d.x * c - d.y * s) * this.scale, this.y + bob + (d.x * s + d.y * c) * this.scale, d.r, 0.9 * this.scale, 0.9 * this.scale);
        }
        // barra de vida propia (minion especial, no boss)
        if (this.state !== 'dying') {
            const w = 90, k = clamp(this.hp / this.maxHp, 0, 1);
            roundRect(g, this.x - w / 2, this.y - 94, w, 9, 4.5);
            g.fillStyle = 'rgba(0,0,0,0.55)';
            g.fill();
            roundRect(g, this.x - w / 2 + 1.5, this.y - 92.5, (w - 3) * k, 6, 3);
            g.fillStyle = '#ff5fb0';
            g.fill();
            comicText(g, 'LA MACHI', this.x, this.y - 107, 15, '#fff', INK, 'center', 0.25);
        }
    }

        }

        }

            g.beginPath();
            g.moveTo(-40, -57);
            g.lineTo(-30, -48);
            g.lineTo(-34, -40);
            g.moveTo(-30, -48);
            g.lineTo(-20, -52);
            g.stroke();
        }
        for (const d of this.decals)

        g.fillStyle = 'rgba(0,0,0,0.3)';
        g.fill();
        ellipse(g, 0, 70, 148, 36);
        fillStroke(g, '#6b3f1e', INK, 3);

        g.lineWidth = 1.2;
        ellipse(g, 0, 66, 110, 22);

        ellipse(g, 0, 66, 70, 13);

        g.fillStyle = 'rgba(255,230,190,0.25)';

        roundRect(g, -16, -9, 32, 18, 2);
        fillStroke(g, '#f4f0e6', INK, 1.5);
